<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlissSMP Wiki</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#fbfaf8;--panel:#f3f1ed;--text:#2b2a28;--muted:#76736d;--line:#e4e1db;--accent:#7a5cff;--code:#efece6;--hover:#e9e6e0}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--text:#e6e3dd;--muted:#9b978f;--line:#2f2f2f;--accent:#a996ff;--code:#2a2a2a;--hover:#2c2c2c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;padding:4px 10px 14px;font-size:15px}
nav h4{margin:16px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav a{display:block;padding:4px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover{background:var(--hover)}
nav a.on{background:var(--hover);font-weight:600}
main{flex:1;min-width:0;padding:48px 64px 96px}
article{max-width:860px;margin:0 auto}
h1{font-size:2.2em;line-height:1.2;margin:0 0 .5em}
h2{font-size:1.45em;margin:1.8em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
h3{font-size:1.15em;margin:1.4em 0 .4em}
a{color:var(--accent)}
code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.88em}
pre{background:var(--code);padding:14px;border-radius:8px;overflow:auto}
pre code{padding:0}
table{border-collapse:collapse;width:100%;margin:1em 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel)}
blockquote{margin:1em 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;color:var(--text)}
blockquote p{margin:.3em 0}
.backlinks{margin-top:3em;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.backlinks h2{border:0;margin:0 0 .4em;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.backlinks ul{margin:0;padding-left:1.2em;columns:2}
img{image-rendering:pixelated;vertical-align:middle;max-width:100%}
img[src*="/hud/"]{height:1.2em;width:auto;margin:0 .15em}
td img{width:44px;height:44px}
p>img:only-child:not([src*="/hud/"]):not([src*="/shot/"]){width:112px;height:112px;display:block;margin:.5em 0 1em}
img[src*="/shot/"]{width:auto;height:auto;border-radius:3px}
table.grid{width:auto;display:table;border-collapse:separate;border-spacing:4px;background:#c6c6c6;padding:6px;border-radius:6px}
table.grid thead{display:none}
table.grid td{width:64px;height:64px;padding:6px;background:#8b8b8b;border:0;box-shadow:inset 2px 2px #373737,inset -2px -2px #fff;text-align:center}
table.grid td img{width:52px;height:52px}
.menu{display:none}
@media (max-width:760px){
  .app{display:block}
  nav{position:fixed;inset:0 auto 0 0;z-index:2;transform:translateX(-100%);transition:transform .2s;height:100vh}
  nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  main{padding:56px 16px 64px}
  .menu{display:block;position:fixed;top:10px;left:10px;z-index:3;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
  .backlinks ul{columns:1}
}
</style>
</head>

<script>
const DATA = {"pages": {"astra": "# Astra Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/astra_t1_e0.png) | ![](img/astra_t1_e1.png) | ![](img/astra_t1_e2.png) | ![](img/astra_t1_e3.png) | ![](img/astra_t1_e4.png) | ![](img/astra_t1_e5.png) |\n| Tier 2 | ![](img/astra_t2_e0.png) | ![](img/astra_t2_e1.png) | ![](img/astra_t2_e2.png) | ![](img/astra_t2_e3.png) | ![](img/astra_t2_e4.png) | ![](img/astra_t2_e5.png) |\n\n## HUD\n![](img/shot/astra_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_astra.png) Drift cooldown |\n| 2 | ![](img/hud/astradagger.png) Daggers / Unbounded cooldown \u00b7 ![](img/hud/tier2_astra.png) Drift cooldown \u00b7 ![](img/hud/astraprojection.png) Projection / Void cooldown |\n| Projecting | ![](img/hud/spook.png) SPOOK ![](img/hud/tier2_astra.png) ![](img/hud/tag.png) TAG |\n\nThe Drift slot shows `Active...` while Drift is running. When Drift is ready and the holder is carrying a soul, it shows the soul's mob name instead (for example, `Iron Golem`). More on the action bar: [HUD](hud.md).\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Two right-clicks within 0.5 s while not sneaking, with the main hand empty or holding a sword or an axe | Gem in off hand | 1+ | Dimensional Drift |\n| Kill a mob or player | Gem in off hand | 1+ | Soul Healing, Soul Capture (energy 3+) |\n| Walk within 1 block of a floating soul | Gem in off hand | 1+ | Pick up the soul (energy 3+) |\n| Sneak and right-click a block | Gem in off hand | 1+ | Release the stored soul (energy 2+) |\n| Left-click air or a block | Gem in main hand | 2 | Phantom Daggers: the first click summons them, and each later click throws one |\n| Hit a player | Gem in main hand | 2 | Unbounded |\n| Right-click air or a block with no entity within 5 blocks in the crosshair | Gem in main hand | 2 | Astral Projection |\n| Right-click a mob, player or other entity | Gem in main hand | 2 | Astral Void |\n| While projecting, left-click a mob or player | Keep the gem in main hand | 2 | Spook |\n| While projecting, right-click a mob or player | \u2013 | 2 | Tag |\n| While projecting, left-click nothing | \u2013 | 2 | End the projection early |\n| While projecting, left-click the holder's own body | \u2013 | 2 | Return to the body |\n| While Unbounded, sneak | \u2013 | 2 | Let go and Haunt |\n\nTier 2 inputs need a tier 2 gem with energy above 0 in the main hand. With a tier 1 gem, they do nothing.\n\n## Ability (Tier 1+)\n### Dimensional Drift\nDrift fires on two right-clicks within 0.5 s with the gem in the off hand and the main hand empty or holding a sword or an axe. Nothing happens if the holder is sneaking.\n1. The holder turns invisible for **5 s**, with no particles.\n2. An invisible, invulnerable, saddled horse spawns under the holder, and the holder mounts it.\n3. The horse runs on its own in the direction the holder looks, at **0.52 blocks per tick** (10.4 blocks per second). The holder steers it by looking.\n4. Pressing and releasing jump triggers a **dash**. The horse vanishes and the holder is launched **1.1** forward in the look direction and **0.5** up. The holder gets **3 dashes**, or 2 at energy 1\u20132.\n5. When the holder lands on a block (not water), a new horse spawns under them after 2 ticks. The holder cannot remount for 1.5 s after a dash.\n6. Drift ends after **5 s** or after the last dash. It ends early if the holder sneaks, takes damage from a mob, player or projectile while riding, dies, or has their gem disabled. When it ends, the horse is removed and the holder's invisibility ends.\n\n- The holder takes no fall damage for **11 s** from the cast.\n- While the holder is drifting, other players see no armour or held items on them.\n\n**Cooldown:** **50 s**, starting when Drift ends. The timer shows 55 s at the cast because it covers the 5 s ride. It does not scale with energy.\n\n## Powers (Tier 2)\n### Phantom Daggers\nPhantom Daggers fire when the holder left-clicks air or a block with the gem in the main hand.\n1. **First click:** if the cooldown is ready, **5 daggers** appear circling in front of the holder, and a `Daggers` boss bar appears that empties over **50 s**.\n2. **Each later click** throws one dagger where the holder looks, at most one every **0.32 s**. A dagger flies straight without dropping for **2 s** (about 65 blocks), then disappears.\n3. When a dagger hits a mob or player:\n   - It deals **2.4 hearts**, taken from absorption first, after which health is set directly. The damage is sized for players in full diamond or netherite armour: a player wearing all four diamond or netherite pieces takes exactly 2.4 hearts, and anyone else takes more the weaker their armour is. Mobs take 2.4 hearts.\n   - The target's gem is disabled for **10 s**, and each further dagger adds another 10 s.\n   - The target is pulled slightly (0.4) toward the point where the dagger hit them. That point is above their feet, so the pull is mostly upward.\n   - Their armour loses 4 durability.\n   - If a hit would kill a player holding a totem of undying in either hand, it kills with a normal hit instead, so the totem pops.\n4. A player who is blocking with a shield while facing the dagger blocks it completely.\n\n**Cooldown:** starts on the **last** throw.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 105.5 s | 103 s | 100.5 s | 97.5 s | 95 s |\n\n- If the boss bar runs out before all 5 daggers are thrown, the rest vanish and the cooldown is **275 s**.\n- If the holder puts the gem away (neither hand holds an Astra gem) before any throw, the daggers vanish and no cooldown starts.\n- If the holder's gem is disabled while daggers are out, they vanish and the normal cooldown starts.\n\nDaggers do not hurt [trusted](trust.md) players or Astra players who are phasing.\n\n### Unbounded\nUnbounded fires when the holder hits a player with the gem in the main hand. This works only when no daggers are out and the Daggers cooldown is ready, since the two share a cooldown.\n1. The holder switches to spectator mode inside the player's view, so the holder sees what the victim sees and moves with them. The holder cannot spectate anyone else.\n2. It lasts up to **15 s**, after which the holder returns to Survival where the victim is.\n3. **Letting go early triggers Haunt.** Sneaking, the victim taking damage from anything other than the holder, or the victim dying drops the holder out at the victim's position in Survival. The first player with a gem within **1 block** of the holder (usually the victim) has their gem disabled for **25 s**.\n\n**Cooldown:** **95 s** from the hit, shared with Phantom Daggers. It does not scale with energy.\n\n- Hitting a mob while the cooldown is ready shows \"You can only unbound on players\" and does nothing else.\n- Neither the hit nor the Haunt spares [trusted](trust.md) players.\n- If the holder is disabled or logs off while Unbounded, the holder goes straight back to Survival.\n\n### Astral Projection\nAstral Projection fires when the holder right-clicks air or a block with the gem in the main hand and no entity within 5 blocks in the crosshair. If there is one, Projection does not fire, and right-clicking that entity from within reach casts Astral Void instead.\n1. The holder's **body** stays behind as a copy of them, with their skin, name, armour and held items. It cannot move or be hurt. If the holder was invisible, it is named `???` and has no skin.\n2. The holder leaves it in spectator mode and can fly through walls.\n3. A world border is drawn **50 blocks** out from the body, visible only to the holder. The server does not pull the holder back.\n4. There is **no time limit**. Purple particles mark the holder's position every 2 s.\n5. Where there is no sky light (in caves or underground), the holder gets **Blindness IV** for 3 s, refreshed every 0.25 s.\n\nWhile projecting, the holder can do the following:\n- **Spook:** left-clicking a mob or player in reach with the gem still in the main hand gives the target **Darkness** for **10 s** and disables its gem for **10 s**, and a player also hears a warden sound. The holder then snaps back to the body. Without the gem in the main hand, the click does nothing.\n- **Tag:** right-clicking a mob or player makes it glow purple for **10 s** and disables its gem for **10 s**. The holder stays projected and can tag more targets. Tagging the same target again resets its timer to 10 s; tags do not stack. When the projection ends, all of the holder's tags end: the glow is removed and any remaining disable time is taken back.\n- **End early:** left-clicking with nothing under the crosshair snaps the holder back.\n- **Return:** left-clicking the holder's own body snaps them back.\n\nThe holder is also sent back if another player hits the body, the holder's gem gets disabled, or the holder logs off.\n\n**Cooldown:** a single timer covers every ending (the ![](img/hud/astraprojection.png) slot). Activating sets it to **120 s**, and the way the projection ends then replaces it:\n\n| Ending | Energy 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Activate (nothing else happens) | 120 s | 120 s | 120 s | 120 s | 120 s |\n| Spook | 120 s | 120 s | 120 s | 120 s | 120 s |\n| Left-click nothing (end early) | 140 s | 135 s | 130 s | 125 s | 120 s |\n| Body hit (the holder clicks it, or a player hits it) | 160 s | 157.5 s | 155 s | 152.5 s | 150 s |\n\nThe Spook, end-early and body-hit cooldowns start from the moment of that ending, not from activation.\n\n[Trusted](trust.md) players cannot be Spooked or Tagged.\n\n### Astral Void\nAstral Void fires when the holder right-clicks any entity (a mob, player, villager, item frame and so on) with the gem in the main hand while the projection cooldown is ready.\n1. A dome forms, centred where that entity stood. It stays in place and does not follow anyone.\n2. Every **2 s**, every other player within **10 blocks** of the centre has their gem disabled, with no timer. A player who walks out is freed at the next 2 s check.\n3. The dome lasts **20 s** (10 checks). It ends early if the holder's own gem gets disabled. When it ends, everyone caught is freed.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 132 s | 128 s | 124 s | 122 s | 120 s |\n\nAstral Void shares Astral Projection's cooldown. It affects players only and spares [trusted](trust.md) players.\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 1 | Phasing | Works with the gem in either hand. Every **10th** hit the holder takes from a mob, player or projectile is cancelled, and the holder phases for **0.5 s**. |\n| 3 | Soul Healing | Works with the gem in the off hand. Walking to the spot where the holder's kill died heals the holder: **2 hearts** and 4 saturation for a mob, or **4 hearts** and 10 saturation for a player. |\n| 3 | Soul Capture | Works with the gem in the off hand. Mobs the holder kills leave a soul that can be picked up, carried and released later. |\n\n### Phasing\n- Only hits from an entity count. Fall damage, fire and other damage do not, and neither do hits absorbed by hurt-immunity frames.\n- The 10th hit is cancelled. For the next **0.5 s**, the holder takes no damage or knockback, attacks on them are cancelled, Phantom Daggers that hit them do nothing, and they are invisible, with other players seeing no armour or held items on them. A purple burst marks the spot, and the count resets to 0.\n\n### Soul Healing\n1. The holder kills a mob or player with the gem in the off hand. Any kill credited to the holder counts, including bow kills.\n2. A purple cloud floats where it died for up to **30 s**.\n3. If the holder walks within **1 block** of it before it fades, the holder is healed once: **2 hearts** and 4 saturation for a mob, or **4 hearts** and 10 saturation for a player.\n\n### Soul Capture\n**Catch**\n1. The holder kills a mob (not a player) with the gem in the off hand at energy 3+.\n2. The mob is saved as it was when it died, including its name, gear, saddle, horse inventory and so on. Its worn gear and a horse's inventory (and chest) stay with the soul instead of dropping. A lead drops normally, and so does any other loot.\n3. The soul floats at the death spot for **30 s**, shown as a purple cloud and a glowing purple sphere.\n\n**Pick up**\n1. A player walks within **1 block** of the soul with an Astra gem in the off hand at energy 3+.\n2. A player can hold **one soul at a time**. While holding one, they walk through others without picking them up.\n3. Picking up a soul heals **2 hearts** and gives 3 saturation. The gem's energy drops by one and is restored 0.2 s later.\n4. Anyone who meets these requirements can pick the soul up, not only the killer.\n5. If nobody picks it up within 30 s, it fades and its gear drops on the spot.\n\n**Carry**\n- The soul belongs to the player, not to the gem. It is saved with the player, so it survives logging off, server restarts and gem swaps.\n- When Drift is ready, the Drift slot shows the soul's mob name.\n\n**Release**\n1. The holder sneaks and right-clicks a block in reach with an Astra gem in the off hand at energy **2+**.\n2. The mob appears on top of that block as the same mob, with its saved name and gear, at full health and not burning.\n3. A purple cloud and sphere appear, and the mob pulses purple 3 times over 3 s.\n4. The holder's soul slot is now empty.\n5. A soul cannot be released while the holder's gem is disabled.\n\n## Notes\n- **Hitting a player** with a ready tier 2 Astra gem in the main hand always fires Unbounded when no daggers are out. **Right-clicking any entity** with it (a villager to trade, a horse to mount) fires Astral Void when the projection cooldown is ready.\n- Phantom Daggers and Unbounded share the ![](img/hud/astradagger.png) cooldown. Astral Projection, Spook and Astral Void share the ![](img/hud/astraprojection.png) cooldown.\n- `/orbs` (also `/astra:orbs`) toggles \"spirit orbs\". It is only offered to players with an Astra gem in their inventory. With orbs off, kills leave no soul and give no Soul Healing. The command is listed under [Commands](commands.md).\n- Phasing, Soul Healing, Soul Capture and releasing a soul all stop working while the gem is disabled.\n- Low energy adds time to every cooldown, as described under [Energy](energy.md). The dragon egg halves every Astra cooldown except Dimensional Drift's.\n\n## Linked from\n- [Commands](commands.md)\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n- [Puff Gem](puff.md)\n", "commands": "# Commands\n\n| Command | What it does |\n|---|---|\n| `/energy` | Shows the player's gem [energy](energy.md). |\n| `/trust add/remove/list/clear <player>` | Manages the player's [Trust](trust.md) list. |\n| `/bliss withdraw <amount>` | Turns energy into [bottles](energy-bottle.md). The gem always keeps at least 1. |\n| `/bliss particles <default/less/minimal/none>` | Sets how many gem particles the player sees. |\n| `/bliss history` or `/history` | Shows the ownership history of the held item. |\n| `/accepttrade`, `/denytrade` | Answers a [gem swap](trader.md#swapping-with-a-player) offer. |\n| `/orbs <enable/disable>` | Turns spirit orbs on or off. Requires an [Astra](astra.md) gem in the inventory. |\n\n`/blissgems` works the same as `/bliss`.\n\n## Linked from\n- [Astra Gem](astra.md)\n- [BlissSMP Wiki](home.md)\n", "death": "# Death\n\n## The gem\n- The gem never drops. It returns to the player when they respawn.\n- It loses 1 [energy](energy.md). A gem already at 0 stays at 0.\n- It returns at tier 1. If it was tier 2, an [Upgrader](upgrader.md) drops where the player died.\n\n## Energy\n| Cause of death | What happens |\n|---|---|\n| Killed by a player whose gem is at 1\u20139 energy | The killer gains 1 energy. |\n| Killed by a player whose gem is at 10 or 0 energy | An [Energy in a Bottle](energy-bottle.md) drops. |\n| No player killer (a fall, lava or a mob) | An [Energy in a Bottle](energy-bottle.md) drops. |\n| The gem was already at 0 | Nothing happens. |\n\n## Dying again within 60 seconds\nA player who dies again within 60 seconds of their previous death keeps their whole inventory and experience. Nothing drops and no death message is shown. The death also has no gem effects: the gem keeps its tier and energy, no Energy in a Bottle or Upgrader drops, and a killer gains no energy.\n\n## Other drops\n- There is a 50% chance that the player's head drops.\n- The player's other items drop as they do in vanilla.\n- If an invisible player is the killer, their name is hidden in the death message.\n\n## Linked from\n- [Energy in a Bottle](energy-bottle.md)\n- [Energy](energy.md)\n- [Gems](gems.md)\n- [Life Gem](life.md)\n- [Upgrader](upgrader.md)\n", "energy-bottle": "# Energy in a Bottle\n\n![](img/energy_bottle.png)\n\nAn Energy in a Bottle holds 1 [energy](energy.md) that can be carried, traded or used.\n\n## Getting one\n- `/bliss withdraw <amount>` bottles energy from the player's gem. The gem always keeps at least 1.\n- A bottle drops when a player whose gem is above 0 energy dies without a player killer.\n- A bottle also drops when a player is killed by someone whose gem is at 10 or 0 energy, as described on [Death](death.md).\n\n## Using it\nRight-clicking with the bottle in the main hand gives the holder's gem 1 energy. This only works while the gem is between 1 and 9 energy.\n\n## Expiry\nEach bottle lasts 60 minutes, but the timer only counts down while the bottle is in a player's inventory. The lore shows the minutes left. One minute after it reaches 0, the bottle disappears.\n\nThe \"From:\" line in the lore shows whose energy it was.\n\n## Linked from\n- [Commands](commands.md)\n- [Death](death.md)\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n", "energy": "# Energy\n\n| Energy | 0 | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|---|\n| Name | Broken | Ruined | Damaged | Cracked | Scratched | Pristine (+0 to +5) |\n| Tier 1 | ![](img/fire_t1_e0.png) | ![](img/fire_t1_e1.png) | ![](img/fire_t1_e2.png) | ![](img/fire_t1_e3.png) | ![](img/fire_t1_e4.png) | ![](img/fire_t1_e5.png) |\n| Tier 2 | ![](img/fire_t2_e0.png) | ![](img/fire_t2_e1.png) | ![](img/fire_t2_e2.png) | ![](img/fire_t2_e3.png) | ![](img/fire_t2_e4.png) | ![](img/fire_t2_e5.png) |\n\nEnergy is stored on the gem and runs from 0 to 10. The `/energy` command shows the current amount.\n\n## Gaining energy\n- **Killing a player** gives the killer 1 energy, as long as the killer's gem is between 1 and 9 and the victim's is not at 0. If the killer's gem is at 10 or 0, the victim's energy drops as an [Energy in a Bottle](energy-bottle.md) instead.\n- **Using an [Energy in a Bottle](energy-bottle.md)** gives the holder 1 energy, as long as their gem is between 1 and 9.\n\n## Losing energy\n- **Dying** costs 1 energy, as described on [Death](death.md).\n- **`/bliss withdraw <amount>`** turns energy into bottles. The gem always keeps at least 1.\n\n## Penalties\n| Energy | Effect |\n|---|---|\n| 0 | The gem has no abilities or passives, and the holder takes 1.5 times as much damage from gem abilities. |\n| 1\u20132 | Crisp ([Fire](fire.md)), Kinetic Burst ([Flux](flux.md)), Vitality Vortex ([Life](life.md)), Dimensional Drift ([Astra](astra.md)), Double Jump ([Puff](puff.md)) and Shadow Stalker ([Strength](strength.md)) work at 75% strength. |\n| 1\u20133 | Every cooldown lasts 3.5 seconds longer. |\n| 4 | Every cooldown lasts 2 seconds longer. |\n| 5\u201310 | No penalty. |\n\n## Linked from\n- [Astra Gem](astra.md)\n- [Commands](commands.md)\n- [Death](death.md)\n- [Energy in a Bottle](energy-bottle.md)\n- [Fire Gem](fire.md)\n- [Flux Gem](flux.md)\n- [Gems](gems.md)\n- [HUD](hud.md)\n- [Life Gem](life.md)\n- [Puff Gem](puff.md)\n- [Speed Gem](speed.md)\n- [Strength Gem](strength.md)\n- [Wealth Gem](wealth.md)\n", "fire": "# Fire Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/fire_t1_e0.png) | ![](img/fire_t1_e1.png) | ![](img/fire_t1_e2.png) | ![](img/fire_t1_e3.png) | ![](img/fire_t1_e4.png) | ![](img/fire_t1_e5.png) |\n| Tier 2 | ![](img/fire_t2_e0.png) | ![](img/fire_t2_e1.png) | ![](img/fire_t2_e2.png) | ![](img/fire_t2_e3.png) | ![](img/fire_t2_e4.png) | ![](img/fire_t2_e5.png) |\n\n## HUD\n![](img/shot/fire_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_fire.png) Crisp cooldown |\n| 2 | ![](img/hud/fire_fireball.png) Fireball/Meteor Shower cooldown, ![](img/hud/tier2_fire.png) Crisp cooldown, ![](img/hud/firecampfire.png) Cozy Campfire cooldown |\n\nThe Crisp slot reads `Active...` while Crisp is running. The [HUD](hud.md) page covers the action bar in full.\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Sneak + right-click twice within 0.5 s | Gem in off hand, main hand empty or holding a sword or axe | 1+ | Crisp |\n| Left-click air or a block | Gem in main hand | 2 | Fireball: the first click starts charging, the next click launches |\n| Melee hit on a mob or player | Gem in main hand | 2 | Meteor Shower |\n| Right-click a block up to 50 blocks away | Gem in main hand | 2 | Cozy Campfire |\n\nNone of these work at energy 0.\n\n## Ability (Tier 1+)\n### Crisp\n1. A sphere with a 5-block radius around where the holder stood turns into Nether terrain. Grass becomes crimson or warped roots, tall grass becomes twisting or weeping vines, leaves become nether or warped wart blocks, logs become crimson or warped stems, and other solid blocks become netherrack, magma or basalt. Block entities (chests, furnaces and so on), bedrock and portals are left untouched. The zone stays where it was cast.\n2. Crisp lasts **18 s**, or ends early if the holder's gem is disabled or leaves their inventory. Every 0.2 s it hits everyone in the zone except the holder, dropped items and [trusted](trust.md) players:\n   - Players are set on fire for at least 3 s and take **1 heart every second**. This is normal attack damage, so armour reduces it. They keep their momentum and take no knockback.\n   - Mobs take **1.5 hearts per hit**. A mob can only be hurt again after 0.5 s, so in practice a mob is hit every 0.6 s, about 2.5 hearts per second.\n3. Every 3 s, players that Crisp has hit lose 1 hunger point while they are within 5 blocks of the centre.\n4. Water inside the sphere is removed every 0.2 s. Water source blocks come back when Crisp ends, as long as the spot is still empty; flowing water does not.\n5. The items in both of the holder's hands are smelted every 3 s, and items players drop inside the zone are smelted as they are dropped. This uses the Autosmelt list, plus cobblestone to stone and cobbled deepslate to deepslate.\n6. When Crisp ends, the blocks revert ring by ring from the edge inwards.\n\nAt energy 1\u20132, the radius, duration and damage are reduced to 75%: a 4-block radius, about 13.6 s, 0.75 hearts per second to players and 1.125 hearts per hit to mobs.\n\n**Cooldown:** 40 s, counted from when Crisp ends. While Crisp is running, a 45 s cooldown prevents the holder from casting it again. The cooldown is the same at every energy level.\n\n## Powers (Tier 2)\n### Fireball\n1. Left-clicking with the gem in the main hand makes a \"Fireball Power\" boss bar appear and a fire charge float above the holder's head.\n2. Charging starts 2 s later and the bar fills once per second:\n   - Normally it gains **+3.33/s**, which takes 32 s to fill from the first click.\n   - While the holder stands on obsidian, fire, lava, netherrack, magma or Crisp ground, it gains **+6.67/s**, which takes 16 s to fill.\n   - If the gem is disabled while charging, the charge is cancelled and the cooldown starts.\n3. A full charge (100) holds for **10 s**, then drains at 3.33/s down to 0. While it is draining or empty, standing on or in a Nether-type block refills it at 6.67/s. These blocks are netherrack, magma, soul sand, soul soil, nylium, wart blocks, basalt, blackstone, quartz, nether bricks, crimson and warped blocks, glowstone, shroomlight, ancient debris, nether ores, respawn anchors, obsidian, crying obsidian, lava, fire, soul fire, netherite blocks and Crisp ground. Refilling to full resets the 10 s hold.\n4. Left-clicking again launches the fireball where the holder is looking. It can be launched at any charge.\n\nThe impact explosion **breaks blocks like TNT**:\n\n| Charge | \u226410 | \u226420 | \u226430 | \u226440 | \u226450 | \u226460 | \u226470 | \u226480 | Above 80 |\n|---|---|---|---|---|---|---|---|---|---|\n| Explosion power | 4 | 4.5 | 5 | 5.5 | 6 | 6.5 | 7 | 8.5 | 9 |\n\nThe explosion itself deals no damage and no knockback. Instead, every mob and player it reaches (except armour stands, the holder and [trusted](trust.md) players) takes:\n\n| Charge | \u226410 | \u226420 | \u226430 | \u226440 | \u226450 | \u226470 | \u226480 | \u226490 | Above 90 |\n|---|---|---|---|---|---|---|---|---|---|\n| Damage | 1 heart | 1.25 | 1.5 | 1.75 | 2 | 2.25 | 2.5 | 2.75 | 3 hearts |\n\n- The fireball deals **+0.5 heart** if it was launched in the air (the block under the holder was air).\n- The damage comes off absorption first, then directly off health. It is tuned so that a player in full diamond or netherite loses exactly the listed amount; weaker armour loses more. If the hit would kill a player holding a totem of undying in either hand, they get a finishing blow instead: their health is set to almost zero, then a 2 heart hit counted as the holder's attack pops the totem.\n- Each armour piece loses durability: 25 at full charge, and less below that.\n- A player blocking toward the blast with a shield takes no damage. Hits of 1.5 hearts or more cost the shield 1 + the damage in HP, rounded down, in durability.\n- A holder's fireball can hurt the same player at most once every 2 s.\n- The fireball also still lands as a normal ghast fireball: a mob or player it hits directly takes 3 hearts of fireball damage, which armour reduces, and a small ghast-strength blast at the impact deals normal explosion damage and knockback. These two hits do not spare [trusted](trust.md) players.\n- It can light fires where it lands.\n- The holder is invulnerable for 0.1 s after launching.\n\n**Cooldown:** 60 s at every energy level, set on launch. It is shared with Meteor Shower. If the gem leaves both of the holder's hands while charging, the charge is cancelled and no cooldown is set.\n\n### Meteor Shower\nMeteor Shower triggers when the holder melee hits a mob or player with the gem in the main hand while the cooldown is ready. It does not trigger while the holder is charging a Fireball.\n\n1. The target receives a message naming the holder and saying they are raining a Meteor Shower on the target.\n2. Every 0.5 s for **10 s** (20 meteors), a fireball spawns 10 blocks above the target, up to 2 blocks to the side, and falls straight down.\n3. Each meteor explodes at power 1.85, which breaks no blocks. It then also bursts like a normal ghast fireball, and that smaller blast can break blocks. Meteors light no fires. If the target player dies to a meteor, the death message names the holder.\n4. Nobody can break blocks within 13 blocks of the drop point, so the target cannot dig out.\n\nThe shower stops early if the target or the holder dies, the holder logs off, or the holder stops carrying their Fire gem. Disabling the holder's gem does not stop it.\n\n**Cooldown:** shared with Fireball:\n\n| Energy | 1\u20132 | 3\u20135 | 6\u20137 | 8\u20139 | 10 |\n|---|---|---|---|---|---|\n| Cooldown | 125 s | 105 s | 95 s | 72.5 s | 60 s |\n\n[Trusted](trust.md) players cannot be targeted.\n\n### Cozy Campfire\nCozy Campfire is cast by right-clicking a block up to 50 blocks away with the gem in the main hand. The block above it must be air.\n\n1. A soul campfire is placed with a countdown above it. Placing a new one removes the holder's old one.\n2. It heals for **600 s (10 min)**, or until it is broken or the holder's gem is disabled. When the time runs out, the countdown disappears and the healing stops, but the soul campfire block stays.\n3. Every second, the holder and the players they [trust](trust.md) within the radius get **Regeneration IV for 1.5 s**. Players below 10 hunger points also gain 4 hunger points.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Radius | 3.25 blocks | 3.75 blocks | 4.25 blocks | 4.75 blocks | 4.5 blocks |\n\n**Cooldown:** 120 s at every energy level, set when the campfire is placed.\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 2 | Fire Resistance | Fire Resistance I while the gem is in either hand. |\n| 3 | Flamestrike | With the gem in the off hand, each hit has a 15% chance to set the target on fire for 5 s. [Trusted](trust.md) players are spared. |\n| 4 | Fireshot | With the gem in the off hand, each arrow has a 15% chance to be lit. |\n| 5 | Autosmelt | With the gem in either hand, the holder's whole inventory and off hand are smelted every tick. Raw iron, gold and copper become ingots; raw mutton, beef, porkchop, chicken and rabbit become cooked; sand becomes glass; and ancient debris becomes netherite scrap. |\n\nAll passives stop while the gem is disabled.\n\n## Notes\n- Fireball and Meteor Shower share the ![](img/hud/fire_fireball.png) cooldown. A main-hand hit fires Meteor Shower if it is ready, so punching with the gem casts it whether or not that was intended.\n- Autosmelt converts everything on its list, so a player cannot carry raw ore, raw meat or sand while holding an energy 5+ Fire gem.\n- Crisp ground counts as warm ground for charging and refilling the Fireball.\n- Fireball hits mobs for the same number of hearts, but only players get the armour tuning.\n- Low energy adds time to every cooldown, as described on the [Energy](energy.md) page. A dragon egg halves the Fireball/Meteor Shower and Cozy Campfire cooldowns. Crisp is not halved.\n\n## Linked from\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "flux": "# Flux Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/flux_t1_e0.png) | ![](img/flux_t1_e1.png) | ![](img/flux_t1_e2.png) | ![](img/flux_t1_e3.png) | ![](img/flux_t1_e4.png) | ![](img/flux_t1_e5.png) |\n| Tier 2 | ![](img/flux_t2_e0.png) | ![](img/flux_t2_e1.png) | ![](img/flux_t2_e2.png) | ![](img/flux_t2_e3.png) | ![](img/flux_t2_e4.png) | ![](img/flux_t2_e5.png) |\n\n## HUD\n![](img/shot/flux_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_flux.png) burst meter |\n| 2 | ![](img/hud/flux_beam.png) Energy Beam/Ground cooldown, ![](img/hud/tier2_flux.png) burst meter and kinetic charge, ![](img/hud/flux_domain.png) Kinetic Overdrive cooldown |\n\nThe burst meter slot shows the Kinetic Burst cooldown while it is cooling down. Both meters are shown to one decimal place. More on the action bar: [HUD](hud.md).\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Right-click twice within 0.5 s | Gem in off hand, main hand empty or holding a sword or axe | 1+ | Kinetic Burst (burst meter above 0) |\n| Left-click air or a block | Gem in main hand | 2 | Energy Beam |\n| Melee hit on a mob or player | Gem in main hand | 2 | Ground |\n| Right-click a mob or player | Gem in main hand | 2 | Kinetic Overdrive |\n| Right-click with a charging item in main hand | Gem in off hand | 2 | Deposit 1 item as watts |\n| Drop (Q) on the gem in the inventory | \u2014 | 2 | Watt Deposit menu |\n| Drop (Q) with the gem in main hand | Main hand | 2 | Start or pause charging |\n| Sneak + right-click while standing on copper and looking at copper | Gem in off hand, main hand empty or holding a sword or axe | 1+, energy 4+ | Copper zip |\n\nPressing Q never drops the gem. The deposit menu and the charging toggle do not work at energy 0.\n\n## The two meters\n| Meter | Range | Feeds | Fills from |\n|---|---|---|---|\n| Burst meter | 0 to 2.0 | Kinetic Burst | Taking damage |\n| Kinetic charge | 0 to 200 | Energy Beam, Ground | Charging watts into a tier 2 gem |\n\n### Filling the burst meter\n1. The holder must have a Flux gem of any tier in the off hand.\n2. Each hit the holder takes adds the final damage in HP divided by 10: a 1-heart hit adds 0.2, and a 5-heart hit adds 1.0.\n3. The meter caps at **2.0** (10 hearts taken).\n4. Each gain fades **15 s** after it was taken.\n5. Kinetic Burst empties the meter.\n\n### Filling kinetic charge: watts\nWatts are stored in a bank, and charging moves them into kinetic charge. The bank holds **2,000,000 watts**, which equals 100 kinetic charge.\n\n**Step 1: deposit.** With a tier 2 Flux gem in the off hand, the holder right-clicks with a charging item in the main hand. Each click deposits one item:\n\n| Item | Watts | Kinetic charge |\n|---|---|---|\n| Diamond | 1,928 | 0.10 |\n| Diamond block | 17,352 | 0.87 |\n| Netherite ingot | 46,819 | 2.34 |\n| Wither skeleton skull | 112,047 | 5.60 |\n| Nether star | 336,141 | 16.81 |\n| Netherite block | 421,378 | 21.07 |\n\nAlternatively, pressing Q on the gem in the inventory opens a 27-slot \"Watt Deposit\" menu. Items placed in it are used when it is closed. As many items as fit under the cap are used; the rest, along with any non-charging items, are returned to the holder.\nAfter each accepted deposit, chat reports the new balance of N watts, enough for up to X% charge. A deposit that would go over 2,000,000 watts is refused without a message.\n\n**Step 2: start.** With the gem in the main hand, the holder presses Q. Chat shows \"Charging started!\". Pressing Q again pauses charging.\n\n**Step 3: hold.** Every second while a tier 2 gem is in either hand:\n- Kinetic charge rises by **+0.67** and the bank loses 13,333 watts.\n- Going from 0 to 100 takes **150 s** and uses the full 2,000,000 watts.\n- Charging stops at **100**.\n- If the bank runs dry, the last of it is added and chat reports that the watts have run out and that the gem is charged at X%.\n- If the gem leaves both hands after the first 2 s of charging, charging pauses and chat shows \"Charging paused!\". Pressing Q resumes it.\n\nWatts and kinetic charge persist across logouts and server restarts.\n\n### Overcharging: 100 to 200\nKinetic charge above 100 can only be reached by overcharging, and it hurts.\n1. At 100, with watts still in the bank, the holder presses Q again.\n2. Chat shows \"\u1d21\u1d00\u0280\u0274\u026a\u0274\u0262: \u1d05\u1d0f \u0274\u1d0f\u1d1b \u0280\u1d07\u029f\u1d07\u1d00s\u1d07 \u0299\u1d07\u1d00\u1d0d \u1d1c\u0274\u1d1b\u026a\u029f 200%\", and a 5-second \"Overcharging begins in...\" countdown appears.\n3. Every **1.5 s**, kinetic charge rises by 0.67. The gem does not need to be in hand, and no watts are used. Every step above 101 costs **1 heart**, so going from 100 to 115 costs 22 hearts over about 35 s.\n4. Past 115 the charge **snaps**: the holder takes **5 hearts**, kinetic charge jumps to **200**, and the rest of the watt bank is wiped.\n5. At 200 the holder takes **5 hearts every 1.5 s** until the Energy Beam is fired.\n\nOnly firing the Energy Beam, landing Ground (which empties the charge) or dying ends an overcharge. Firing before reaching 200 causes a misfire.\n\n### Spending kinetic charge\n- **Energy Beam** uses all of it.\n- **Ground** sets it to 0 one second after the hit lands.\n- **Dying** sets it to 0, but the watt bank is kept.\n\n## Ability (Tier 1+)\n### Kinetic Burst\n1. Every mob and player touching a box that reaches **5 blocks** from the holder in each direction, so up to about 7 blocks along the diagonals (except the holder and [trusted](trust.md) players), takes damage in hearts equal to the holder's burst meter. A full 2.0 meter deals **2 hearts**.\n2. They are knocked away and up: 0.34 \u00d7 the meter sideways and 0.2 \u00d7 the meter upwards.\n3. The meter empties 0.5 s later.\n\nThe damage comes off absorption first, then directly off health. It is tuned so that a player in full diamond or netherite loses exactly the listed amount; weaker armour loses more. If the hit would kill a player holding a totem, it is dealt as a normal hit instead, so the totem can pop.\n\nAt energy 1\u20132, the box reaches 3.75 blocks and the damage is 75% (1.5 hearts at a full meter).\n\n**Cooldown:** 15 s at every energy level.\n\n## Powers (Tier 2)\n### Energy Beam\nThe beam fires where the holder is looking and uses **all** of the holder's kinetic charge. What happens depends on the charge at the moment of the click:\n\n| Kinetic charge | What happens | Reach | Hits after |\n|---|---|---|---|\n| 0 | Small spiral zap. Charge stays at 0 | Hits at 3.7 and 6.4 blocks | 0.1 s |\n| Above 0 to 11 | Short spray | 8 blocks (10 above 5) | 0.75 s |\n| Above 11 to 20 | Spray | 16 blocks | 0.75 s |\n| Above 20 to 41 | Ring beam. Only hits **players** within 3 blocks of the beam | 38 blocks | 0.75 s |\n| Above 41 to 56 | Ring beam | 40 blocks | About 1 s |\n| Above 56 to 65 | Full beam | 70 blocks | About 1 s |\n| Above 65 to 85 | Full beam with wind-up | 70 blocks (80 above 76) | 1.75 s |\n| Above 85 to 100.1 | Full beam with wind-up | 80 blocks | 1.75 s |\n| Above 100.1, below 200 | **Misfire.** No beam fires, the gem **loses 1 energy** and the charge is gone | \u2014 | \u2014 |\n| 200 | **Overload.** A huge beam fires, the holder's health is set to **0.1 heart** and the holder is thrown backwards | About 130 blocks | 1.85 s |\n\nApart from the ring beam above 20 to 41 charge, every point along the beam hits mobs and players touching a box that reaches **5 blocks** out from it in each direction.\n\n**Damage.** Each target is hit once per beam. The holder and [trusted](trust.md) players are never hit. Damage is highest close to the holder and near the centre of the beam, and lowest at the edge of the beam 20 or more blocks out:\n\n| Kinetic charge | 0 | 50 | 100 | 200 |\n|---|---|---|---|---|\n| Damage range | 2\u20133.5 hearts | 4.25\u20135.5 hearts | 6.5\u20137.5 hearts | 10 hearts |\n\n- The damage comes off absorption first, then directly off health, with the same armour tuning as Kinetic Burst. Totems still work.\n- Each armour piece loses **charge + 44** durability (144 at 100 charge). This does not apply to the ring beam above 20 to 41 charge.\n- A player blocking with a shield is knocked down and cannot raise the shield for 5 s. The hit still lands.\n- The kill message is \"(player) was obliterated by (holder's name)\".\n\n**Cooldown:** shared with Ground and set at the moment of the click:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 40 s | 37.5 s | 35 s | 32.5 s | 30 s |\n\n### Ground\nGround triggers on a melee hit on a mob or player with the gem in the main hand while the Beam/Ground cooldown is ready.\n\n1. The target hops up slightly. 0.2 s later it is **frozen for 4 s** and takes damage based on the holder's kinetic charge: **0.5 hearts at 0, 4 at 100 and 7.5 at 200**.\n2. The hit splashes to one extra target per 20 kinetic charge (up to 5), nearest to the target first. Splash targets take **50%** damage and are frozen for **3 s**. They are picked from a box around the target that reaches this far in each direction:\n\n| Energy | 1\u20132 | 3\u20134 | 5\u201310 |\n|---|---|---|---|\n| Splash reach | 2.25 blocks | 2.75 blocks | 3 blocks |\n\n3. Below 50 kinetic charge, every freeze lasts **1 s**.\n4. Kinetic charge drops to 0 one second later.\n\nGround damage works like the beam: it comes off absorption first, then directly off health, with the same armour tuning. The kill message is \"(player) experienced high voltage from (holder's name)\". The holder and [trusted](trust.md) players are spared.\n\n**Cooldown:** shared with Energy Beam, using the same table.\n\n### Kinetic Overdrive\n1. Right-clicking marks the mob or player that was clicked, plus every player within extra reach of them who is not [trusted](trust.md):\n\n| Energy | 1 | 2\u20133 | 4\u201310 |\n|---|---|---|---|\n| Extra reach | 3.25 blocks | 3.5 blocks | 4 blocks |\n\n2. For **30 s**, every hit a marked player lands on anything gives the holder 1 attack point. The holder's next melee hit on a mob or untrusted player spends them:\n\n| Attack points | 0\u20132 | 3\u20135 | 6\u20138 | 9\u201311 | 12\u201314 | 15 | 16+ |\n|---|---|---|---|---|---|---|---|\n| Holder's hit deals | Normal | 1.1\u00d7 | 1.2\u00d7 | 1.3\u00d7 | 1.4\u00d7 | 1.5\u00d7 | Normal |\n\n   A boosted hit also pushes the target away and resets the holder's points to 0. Chat notifies the holder on reaching 3, 6, 9, 12 and 15 points.\n3. During the same 30 s, every block a marked player breaks gives the holder 1 mining point. At 5, 10, 15, 20 and 25 points the holder gets **Haste I, II, III, IV and V** for 20, 40, 60, 80 and 100 s respectively.\n4. When Overdrive ends, the holder's Haste is removed.\n\n**Cooldown:**\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 105 s | 101.5 s | 97.5 s | 94 s | 90 s |\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 2 | Flow State (movement) | With the gem in the off hand, moving builds speed in steps of **+10% walking speed**, up to **+200%**. Step 1 takes 200 movement updates, step 10 about 1,400 and step 20 about 2,000 (one update per tick while moving). It resets if the holder stops for about 1.5 s, sprint-jumps, or takes a hit from an untrusted player. Chat shows \"Now moving at +X% speed!\" |\n| 2 | Flow State (mining) | With the gem in the off hand, breaking blocks in a row (with gaps under about 1.5 s) gives Haste. More than 12 blocks gives Haste I, more than 24 gives Haste II, and so on up to **Haste VI** at more than 72. The effect is refreshed every second. |\n| 2 | Conduction | With the gem in the off hand, combo hits (with gaps under about 1.5 s) deal extra damage. Hits 1\u20132: +0.8 hearts. Hit 3: +1.7. Hits 4\u20135: +0.9. Hit 6: +1.9. Hits 7\u20138: +1.0. Hit 9: +2.1. Hits 10\u201311: +1.1. Hit 12: +2.3. Hits 13\u201314: +1.2. Hit 15: +2.7. From hit 16 onwards there is no bonus until the combo resets. Hits on [trusted](trust.md) players do not count. |\n| 4 | Shocking Chance | With the gem in the off hand, each bow or crossbow arrow has a 15% chance to be charged (shown by a blue trail). When a charged arrow hits, it strikes harmless lightning, deals 0.5 hearts directly off health and **freezes the target for 2 s**. [Trusted](trust.md) players are spared. |\n| 4 | Copper zip | With the gem in the off hand and the main hand empty or holding a sword or axe, sneaking and right-clicking while standing on any block with \"copper\" in its name and looking at another one up to 50 blocks away teleports the holder on top of it. This passive is not listed on the gem. |\n| 5 | Tireless | With the gem in either hand, Slowness, Hunger and Weakness cannot be applied to the holder and are removed every 0.25 s. |\n| 5 | Charged | With a tier 2 gem in either hand, the holder takes no damage from charged creepers. |\n\n## Notes\n- Energy Beam and Ground share the ![](img/hud/flux_beam.png) cooldown. A main-hand hit fires Ground if it is ready.\n- Charging, watts and kinetic charge are tier 2 only. Tier 1 has only the burst meter.\n- Firing the beam between 100.1 and 199.9 kinetic charge costs a gem energy and all of the holder's charge.\n- Depositing does not cancel the click, so blocks and skulls are best deposited by right-clicking into the air.\n- Shocking Chance is armed per arrow. If a charged arrow misses, its charge is lost.\n- Low energy adds time to every cooldown, as described on the [Energy](energy.md) page. A dragon egg halves the Energy Beam/Ground and Kinetic Overdrive cooldowns. Kinetic Burst is not halved.\n\n## Linked from\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "gems": "# Gems\n\n| Tier | What it gives |\n|---|---|\n| 1 | The gem's ability and passives |\n| 2 | The ability, the passives and the gem's powers |\n\n## Getting a gem\nA player receives a random tier 1 gem with 5 energy on their first join. This only happens once per player. If their inventory is full, they get it on a later join, once a slot is free. A [Trader](trader.md) changes the gem's type afterwards, and an [Upgrader](upgrader.md) raises it to tier 2.\n\n## Energy\nEvery gem has between 0 and 10 [energy](energy.md). More energy unlocks more passives. At 0 energy the gem is Broken and nothing on it works.\n\n## Controls\nEach gem is used differently. The Controls table on every gem page lists which hand, button and tier each ability needs. The holder's cooldowns are shown on the [HUD](hud.md).\n\n## Rules for every gem\n- A gem cannot be dropped, stored in a container, placed in an item frame, on an armour stand, shelf or decorated pot, or given to an allay. If a player closes a menu or logs out with a gem on the cursor, it returns to their inventory.\n- Abilities that check [Trust](trust.md) do not affect players the holder trusts.\n- Gem abilities can be locked for a while. The [HUD](hud.md) shows the time left.\n- Carrying a dragon egg halves most cooldowns. Drift, Crisp, Kinetic Burst, Vitality, Thunder and Bounty are not halved.\n- Low energy weakens a gem, as described under [penalties](energy.md#penalties).\n- A player carrying a Broken gem takes 1.5 times as much damage from other players' gem abilities.\n- When the holder dies, a tier 2 gem drops back to tier 1, as described on [Death](death.md).\n", "home": "# BlissSMP Wiki\n\nEvery player carries one gem. A gem grants an ability, passives and, at tier 2, powers. Its tier and its energy decide how strong it is.\n\n## Gems\n| | Gem | Focus |\n|---|---|---|\n| ![](img/fire_t1_e5.png) | [Fire](fire.md) | Burning, fireballs and a healing campfire |\n| ![](img/flux_t1_e5.png) | [Flux](flux.md) | Stored charge and energy beams |\n| ![](img/astra_t1_e5.png) | [Astra](astra.md) | Souls, daggers and astral projection |\n| ![](img/speed_t1_e5.png) | [Speed](speed.md) | Movement and lightning |\n| ![](img/strength_t1_e5.png) | [Strength](strength.md) | Damage and bounties |\n| ![](img/wealth_t1_e5.png) | [Wealth](wealth.md) | Ores, luck and curses |\n| ![](img/life_t1_e5.png) | [Life](life.md) | Healing and hearts |\n| ![](img/puff_t1_e5.png) | [Puff](puff.md) | Double jumps and knock-ups |\n\n## Items\n| | Item | Use |\n|---|---|---|\n| ![](img/energy_bottle.png) | [Energy in a Bottle](energy-bottle.md) | Adds 1 energy to the holder's gem |\n| ![](img/trader.png) | [Trader](trader.md) | Changes the holder's gem type |\n| ![](img/upgrader.png) | [Upgrader](upgrader.md) | Upgrades a tier 1 gem to tier 2 |\n\n## Reference\n- [Trust](trust.md)\n- [Commands](commands.md)\n- [HUD](hud.md)\n", "hud": "# HUD\n\nWhile a player holds a gem in either hand, the action bar above the hotbar shows its cooldowns. If both hands hold a gem, only the main-hand gem is shown. The bar updates four times a second.\n\n| Shows | Meaning |\n|---|---|\n| ![](img/shot/ready.png) | The ability can be used. |\n| ![](img/shot/cd12.png) ![](img/shot/cd90.png) | The time left on the cooldown. |\n| ![](img/shot/active.png) | The ability is running. |\n| ![](img/shot/off.png) | An ability that is turned off on this server is left out. Here Crisp is off, so only Fireball and Cozy Campfire show. |\n| ![](img/shot/broken.png) | The gem is at 0 [energy](energy.md). |\n| ![](img/shot/disabled.png) | The holder's abilities are locked for 8 more seconds. |\n\nA tier 1 gem shows only its ability, marked with ![](img/hud/tier1_fire.png):\n\n![](img/shot/fire_t1.png)\n\nA tier 2 gem shows a power, then the ability marked with ![](img/hud/tier2_fire.png), then the second power:\n\n![](img/shot/fire_t2.png)\n\nEach gem's icons are listed on its own page: [Fire](fire.md), [Flux](flux.md), [Astra](astra.md), [Speed](speed.md), [Strength](strength.md), [Wealth](wealth.md), [Life](life.md) and [Puff](puff.md).\n\n## Linked from\n- [Astra Gem](astra.md)\n- [Fire Gem](fire.md)\n- [Flux Gem](flux.md)\n- [Gems](gems.md)\n- [BlissSMP Wiki](home.md)\n- [Life Gem](life.md)\n- [Puff Gem](puff.md)\n- [Speed Gem](speed.md)\n- [Strength Gem](strength.md)\n- [Wealth Gem](wealth.md)\n", "life": "# Life Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/life_t1_e0.png) | ![](img/life_t1_e1.png) | ![](img/life_t1_e2.png) | ![](img/life_t1_e3.png) | ![](img/life_t1_e4.png) | ![](img/life_t1_e5.png) |\n| Tier 2 | ![](img/life_t2_e0.png) | ![](img/life_t2_e1.png) | ![](img/life_t2_e2.png) | ![](img/life_t2_e3.png) | ![](img/life_t2_e4.png) | ![](img/life_t2_e5.png) |\n\n## HUD\n![](img/shot/life_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_life.png) Vitality Vortex |\n| 2 | ![](img/hud/life_heart.png) Heart Drainer/Heart Lock cooldown \u00b7 ![](img/hud/tier2_life.png) Vitality Vortex \u00b7 ![](img/hud/life_rose.png) Circle of Life cooldown |\n\nThe Vitality Vortex slot reads `Active...` while the vortex is running. More on the action bar: [HUD](hud.md).\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Sneak + right-click twice within 0.5 s | Gem in off hand, main hand empty or a sword/axe | 1+ | Vitality Vortex |\n| Left-click air or a block | Gem in main hand | 2 | Heart Drainer |\n| Hit on a mob or player | Gem in main hand | 2 | Heart Lock |\n| Right-click air or a block | Gem in main hand | 2 | Circle of Life (solo) |\n| Right-click a mob or player | Gem in main hand | 2 | Circle of Life (group) |\n| Sneak + right-click a block | Gem in off hand | 1+ | Green Thumb (passive, energy 2+) |\n\nA left-click or hit with a tier 1 gem in the main hand shows a chat message saying that a tier 2 gem is needed to cast the skill.\n\n## Ability (Tier 1+)\n### Vitality Vortex\n1. The vortex is a sphere with a radius of **6 blocks**, centred 1 block behind the holder.\n2. If the sphere contains any log, leaf or flower, the holder's food is set to 20 and saturation to 30.\n3. If it contains leaves or flowers, the holder gets **Absorption II for 60 s**. If it contains logs, the holder gets **Resistance I for 15 s**.\n4. Every block in the sphere then withers, starting with the nearest: 40 blocks change at once, then 20 more each tick.\n   - A **flower** turns into dead coral, and each one adds 1 s of **Regeneration II**.\n   - A **leaf block** turns into tuff or a dead coral block and gives **Absorption I for 90 s**.\n   - A **log** turns into an acacia log, and each one adds 1 s of **Resistance I**.\n   - Any other solid block turns into tuff or a dead coral block.\n5. After **15 s**, every changed block reverts.\n\nOnly these blocks count as logs, leaves and flowers: oak, spruce, birch, jungle, acacia, dark oak, mangrove and cherry logs and leaves, and poppies, dandelions, cornflowers, sunflowers, blue orchids, alliums, azure bluets, the four tulips and oxeye daisies.\n\nThe vortex never changes block entities (chests, furnaces and so on), waterlogged blocks, air, liquids, bedrock, portals, end portal frames or reinforced deepslate.\n\nAt energy 1\u20132, the radius is 5 blocks, Absorption II lasts 45 s and Resistance I lasts 11.25 s.\n\n**Cooldown:** 40 s after the vortex ends, at every energy level. The ability affects only the holder.\n\n## Powers (Tier 2)\n### Heart Drainer\n- Every mob and player in a box around the holder's feet loses **2 max hearts for 60 s**. The box reaches this far in each direction:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Reach | 2.25 blocks | 2.25 blocks | 2.75 blocks | 2.75 blocks | 3 blocks |\n\n- Max health cannot drop below 1 heart. A mob that is still alive after 60 s gets its hearts back.\n- Casting again on the same player refreshes the 60 s instead of stacking. Drains from different Life players do stack.\n\n**Cooldown:** 120 s at every energy level, shared with Heart Lock.\n[Trusted](trust.md) players are spared.\n\n### Heart Lock\nHeart Lock triggers on a hit on a target while it is ready.\n- The target must have more than 3 max hearts.\n- For **20 s**, the target's max health is locked to the health they had when hit, with a minimum of **3 hearts**. They cannot heal past it.\n- A pink tether links the holder to the target. A player target receives a chat message saying that their heart count has been locked for 20 seconds.\n- A mob that is still alive after 20 s gets its old max health back.\n- The lock ends early if the target dies or the holder's Life gem is disabled.\n\n**Cooldown:** 100 s after the 20 s lock ends, at every energy level, shared with Heart Drainer. Hitting while it is on cooldown shows no message.\n[Trusted](trust.md) players are spared.\n\n### Circle of Life\nCircle of Life has two versions that share one cooldown.\n\n**Solo** (right-click air or a block):\n- A ring follows the holder for **30 s**. Its radius depends on energy:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Radius | 2.75 blocks | 3.25 blocks | 3.25 blocks | 3.75 blocks | 4 blocks |\n\n- The holder gains **+2 max hearts** while it runs.\n- [Trusted](trust.md) players inside the ring gain **+2 max hearts**, and other players inside lose **2 max hearts**.\n- Leaving the ring removes the change immediately, and every change is removed when the circle ends.\n- Once per second, 1 durability is repaired on a random damaged armour piece the holder is wearing.\n- The circle ends early if the holder logs off or the gem is disabled.\n\n**Cooldown:** 150 s after the 30 s circle ends, at every energy level.\n\n**Group** (right-click a mob or player):\n- The holder gains **+5 max hearts for 90 s**.\n- A ring spreads from the clicked entity, and every player within this distance loses **2 max hearts for 90 s**:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Radius | 3 blocks | 3 blocks | 4 blocks | 4 blocks | 4 blocks |\n\n- It affects players only, and hits them once when cast. Leaving the area does not remove the loss.\n\n**Cooldown:** 90 s after the 90 s effect ends, at every energy level.\n[Trusted](trust.md) players are spared.\n\n## Passives\nThe passives work in the off hand only, except Wither Immune, which works in either hand.\n\n| Energy | Passive | Effect |\n|---|---|---|\n| 2 | Green Thumb | Sneaking and right-clicking a block with the main hand applies free bone meal. It does nothing on grass blocks, sand, gravel or moss blocks. |\n| 3 | Bonus Absorption | A golden apple gives **Absorption II for 60 s**, and an enchanted golden apple gives **Absorption V for 60 s**. This replaces any existing Absorption and is applied before the apple's own effects. |\n| 4 | Wither Immune | The holder takes no damage from the Wither effect. |\n| 5 | Radiant Fist | Hits on undead deal **1.5\u00d7** damage at tier 1 or **2\u00d7** at tier 2. Undead means wither skeletons, the Wither, zombies, zombie villagers, husks, drowned, strays, skeletons, phantoms, zoglins and zombified piglins. |\n\n## Notes\n- Heart Drainer and Heart Lock share the ![](img/hud/life_heart.png) cooldown.\n- Solo and group Circle of Life share the ![](img/hud/life_rose.png) cooldown.\n- The mod manages every player's max health, whether they use Life or not. The base is **10 hearts**, or **20 hearts** with a dragon egg in the inventory, plus or minus any Life effects. It is rechecked every second.\n- Dying wipes every Life heart change, good or bad, as described on the [Death](death.md) page.\n- Low energy adds time to every cooldown, as described on the [Energy](energy.md) page. A dragon egg halves the total wait from the cast (active time plus cooldown) for Heart Drainer, Heart Lock and Circle of Life, but not for Vitality Vortex.\n\n## Linked from\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "puff": "# Puff Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/puff_t1_e0.png) | ![](img/puff_t1_e1.png) | ![](img/puff_t1_e2.png) | ![](img/puff_t1_e3.png) | ![](img/puff_t1_e4.png) | ![](img/puff_t1_e5.png) |\n| Tier 2 | ![](img/puff_t2_e0.png) | ![](img/puff_t2_e1.png) | ![](img/puff_t2_e2.png) | ![](img/puff_t2_e3.png) | ![](img/puff_t2_e4.png) | ![](img/puff_t2_e5.png) |\n\n## HUD\n![](img/shot/puff_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_puff.png) Double Jump |\n| 2 | ![](img/hud/puff_fist.png) Breezy Bash cooldown \u00b7 ![](img/hud/tier2_puff.png) Double Jump \u00b7 ![](img/hud/puff_arrow.png) Dash cooldown |\n\nThe Double Jump slot reads `Active...` while the holder is airborne after a double jump. The [HUD](hud.md) page covers the action bar in full.\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Jump in mid-air (Survival or Adventure only) | Gem in either hand | 1+ | Double Jump |\n| Right-click air or a block | Gem in main hand | 2 | Dash |\n| Hit a mob or player | Gem in main hand | 2 | Breezy Bash (solo) |\n| Left-click air or a block | Gem in main hand | 2 | Breezy Bash (group) |\n| Drop (Q) | Gem in either hand, or the gem itself dropped | 1+ | Enchants Power, Enchants Punch |\n\nRight-clicking or left-clicking with a tier 1 gem in the main hand shows the holder a message saying that a tier 2 gem is needed to cast the skill. Hitting with it does nothing.\n\n## Ability (Tier 1+)\n### Double Jump\nJumping again while there is air directly below the holder triggers a double jump. This works in Survival and Adventure only.\n- It pushes the holder up and forward in the direction they are looking, replacing their current motion.\n- The upward push depends on energy:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Upward push | 0.3 | 0.375 | 0.6 | 0.7 | 0.8 |\n\n- The forward push is 1.0, or 0.75 at energy 1\u20132.\n\n**Cooldown:** While the holder is airborne, the cooldown is locked for up to 50 s. Landing on the ground, in water or on something climbable sets it to **5 s**. The holder gets one double jump each time they are in the air.\n\n## Powers (Tier 2)\n### Dash\n- Dash launches the holder in the direction they are looking with a push of **3.5**, replacing their current motion.\n- For **2 s** after casting, every mob and player in a box reaching **2.5 blocks** around the holder is hit once:\n  - **Mobs** take **2.5 hearts**.\n  - **Players above 2 hearts** take **2 hearts**.\n  - **Players at 2 hearts or less** take **2.5 hearts**. If they hold a totem of undying in either hand, they get a finishing blow instead: their health is set to almost zero, then a 2 heart hit counted as the holder's attack pops the totem.\n- The damage comes out of absorption first, then health is set directly, so armour does not reduce it. Against players it is sized for full diamond or netherite: a player wearing all four diamond or netherite pieces takes exactly the number above, and anyone else takes more, the weaker their armour.\n- A player who is shield-blocking while facing the holder stops the dash. The blocking player takes no damage, their shield loses 5 or 6 durability, and the holder's horizontal movement stops.\n- Dashing down at the ground plays a ground-slam effect. It is only particles, sounds and flying block pieces; no blocks change.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 55 s | 52.5 s | 50 s | 47.5 s | 45 s |\n\nDash does not hit [trusted](trust.md) players or phasing [Astra](astra.md) players.\n\n### Breezy Bash\nBreezy Bash has two versions that share one cooldown.\n\n**Solo** (triggered by hitting a mob or player while it is ready):\n- A white tether links the holder to the target. One tick later, the target is launched straight up with a push of **3.9**.\n- **1.1 s** later, the target is slammed straight down with a push of **3.9**.\n- The slam is cancelled if the target dies in between.\n- If the target is [trusted](trust.md), the tether shows but nothing else happens, and no cooldown is used.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 102 s | 99 s | 96 s | 93 s | 90 s |\n\n**Group** (triggered by left-clicking air or a block):\n- Every mob and player in a box around the holder is pushed up by **2.5** and away by **4.33**. The box reaches this far in each direction:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Reach | 2.75 blocks | 3.25 blocks | 3.25 blocks | 3.75 blocks | 4 blocks |\n| Cooldown | 102 s | 99 s | 96 s | 93 s | 90 s |\n\n- Left-clicking while it is on cooldown shows no message.\n\nBoth versions spare [trusted](trust.md) players.\n\n## Passives\nThe passives work with the gem in either hand.\n\n| Energy | Passive | Effect |\n|---|---|---|\n| 1 | Enchants Power | Pressing drop (Q) with the gem in either hand, or dropping the gem itself, sets every bow the holder carries to Power V. |\n| 1 | Enchants Punch | The same trigger sets every bow the holder carries to Punch II. |\n| 2 | Fall Damage Immunity | The holder takes no fall damage. |\n| 2 | Sculk Silence | The sculk sensor \"tendrils clicking\" game event is cancelled when the holder is its source. |\n| 2 | Crop Tramp-Less | The holder does not trample farmland. |\n\n## Notes\n- Solo and group Breezy Bash share the ![](img/hud/puff_fist.png) cooldown.\n- Every push sets the holder's velocity rather than adding to it.\n- If the holder logs off during the 50 s Double Jump lock, the lock keeps counting down while they are offline. If they rejoin before it runs out, landing replaces it with the 5 s cooldown.\n- The bow enchants set exactly Power V and Punch II, on bows only. They check the holder's hands, armour slots and whole inventory.\n- Group Breezy Bash's chat message shows the real reach for the gem's energy, as in the table above.\n- Low energy adds time to every cooldown, as described on the [Energy](energy.md) page. A dragon egg halves the Dash, Breezy Bash and 5 s Double Jump timers, but not the 50 s in-air lock.\n\n## Linked from\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "speed": "# Speed Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/speed_t1_e0.png) | ![](img/speed_t1_e1.png) | ![](img/speed_t1_e2.png) | ![](img/speed_t1_e3.png) | ![](img/speed_t1_e4.png) | ![](img/speed_t1_e5.png) |\n| Tier 2 | ![](img/speed_t2_e0.png) | ![](img/speed_t2_e1.png) | ![](img/speed_t2_e2.png) | ![](img/speed_t2_e3.png) | ![](img/speed_t2_e4.png) | ![](img/speed_t2_e5.png) |\n\n## HUD\n![](img/shot/speed_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_speed.png) Terminal Velocity cooldown |\n| 2 | ![](img/hud/speed_injection.png) Blur cooldown \u00b7 ![](img/hud/tier2_speed.png) Terminal Velocity cooldown \u00b7 ![](img/hud/speed_bolt.png) Speedy Storm |\n\nThe Terminal Velocity slot shows `Active...` for 1 s after use. The Storm slot shows `Ready!` when all clouds are stocked; otherwise it shows clouds/3 and the seconds until the next cloud. More on the action bar: [HUD](hud.md).\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Two right-clicks within 0.5 s, with the main hand empty or holding a sword or an axe | Gem in off hand | 1+ | Terminal Velocity |\n| Left-click on air or a block | Gem in main hand | 2 | Arm Blur |\n| A hit on a mob or player within 5 s of arming | Any item | 2 | Blur |\n| Right-click on air or a block | Gem in main hand | 2 | Speedy Storm |\n| Drop key (Q) | Gem in either hand, or the gem itself dropped | 1+ | Enchants Efficiency, Enchants Soul Speed |\n\nWith a tier 1 gem in the main hand, right-clicking shows the message \"You need tier 2 gem to cast this skill!\" and left-clicking does nothing.\n\n## Ability (Tier 1+)\n### Terminal Velocity\nTerminal Velocity is triggered by right-clicking twice within 0.5 s with the gem in the off hand and the main hand empty or holding a sword or an axe.\n- **Behind a target:** if a mob, player or other entity is within **5 blocks** in the holder's crosshair with nothing in the way, the holder teleports up to **1.5 blocks** behind it (based on its facing, stopping short of solid blocks), facing it. The cooldown is **15 s**.\n- **Dash:** otherwise, the holder bursts horizontally at **5 blocks per tick** (capped at 3.9 per axis) in the walking direction, or in the look direction if no movement key is pressed. Two ticks later, the holder is braked to 0.1, so the dash covers about 4 blocks. The cooldown is **30 s**.\n- Either way, the holder takes no fall damage until landing (for up to 5 s), and lightning sparks trail the holder for 0.5 s.\n\n**Hit refund:** while Terminal Velocity is on cooldown, each fully charged hit (attack bar above 90%) on a player the holder does not [trust](trust.md) takes **5 s** off it.\n\nThe cooldowns do not scale with energy. The target pick does not skip trusted players.\n\n## Powers (Tier 2)\n### Blur\n1. **Arm:** the holder left-clicks air or a block with the gem in the main hand while Blur is ready. Chat says \"Your next hit will inflict Blur!\" and yellow sparks surround the holder.\n2. **Hit:** the holder hits a mob or player within **5 s**. Any melee hit counts, and the holder does not need to be holding the gem. If nothing is hit in time, Blur unreadies with no cooldown.\n3. **Strikes:** every 0.25 s, a clone appears **1.25 blocks** from the target and strikes it for a random **0.5 to 1 heart**. Each strike is a normal player attack, so armour reduces it, and it ignores hurt-immunity frames.\n4. **Streak:** after the strikes, the holder stays armed, and the next hit starts another Blur with no cooldown. Blurs 1-5 strike **3** times. From the 6th Blur on, each strikes once more than the last, up to **15**.\n\nThe **streak ends** and the cooldown starts when:\n- the holder takes any damage while the clones are striking (or within 0.5 s of a clone appearing);\n- a mob or player hits the holder during the strikes;\n- the target dies or disappears before the strikes finish;\n- the holder's gem gets disabled.\n\nIf the holder dies or logs off, the streak resets. The cooldown starts if this happens during the strikes or within 5.25 s after a Blur's strikes end; otherwise there is no cooldown.\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 100 s | 97.5 s | 95 s | 92.5 s | 90 s |\n\n[Trusted](trust.md) players cannot be Blurred. A target that is already being Blurred cannot be Blurred again until that Blur ends.\n\n### Speedy Storm\nSpeedy Storm is cast by right-clicking air or a block with the gem in the main hand.\n1. The holder has **3 clouds**, and each right-click throws one. When none are left, chat says \"You dont have any clouds left!\".\n2. The holder gets **1 cloud back every 20 s**, up to 3.\n3. The cloud flies where the holder looks at **1.5 blocks per tick**, slowing and dropping as it goes, and lands on the first solid block it hits. If it falls out of the world, it fizzles.\n4. When it lands, it forms a storm with a radius of **5 blocks** that lasts **10 s**. A storm cloud hangs 10 blocks above it, and its lightning is visual only.\n5. Every 0.5 s, every player in the radius is affected:\n   - **The holder and players the holder [trusts](trust.md)** get Speed for **3 s**.\n   - **Everyone else** gets Slowness for **3 s** and cannot use wind charges for 2.5 s.\n6. The effects only keep applying for **3 s** after the first player steps in. The cloud stays visible until the storm ends.\n\n| Clouds left after the throw | 2 | 1 | 0 |\n|---|---|---|---|\n| Holder's and allies' Speed | III | IV | V |\n| Enemies' Slowness | II | II | V |\n\n**Stacking:** a cloud that lands within 5 blocks of the holder's running storm joins it. The lightning gets stronger, the storm keeps the higher Speed and Slowness levels of the two throws, and the effects restart. With 2 clouds, the storm lasts another **11.5 s**; with 3 clouds, another **7.1 s**.\n\nThe storm stops early if the holder's gem gets disabled. It affects players only; mobs are unaffected.\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 1 | Enchants Efficiency | Press drop (Q) with the gem in either hand, or drop the gem itself. Every pickaxe, axe, shovel, hoe and pair of shears the holder carries is set to Efficiency V. |\n| 1 | Enchants Soul Speed | Uses the same trigger. Every pair of boots the holder carries is set to Soul Speed III. |\n| 2 | Speed | With the gem in either hand, the holder gets **Speed II**. |\n| 2 | Dolphin's Grace | With the gem in either hand, the holder gets Dolphin's Grace while in water and not wearing boots. |\n\n## Notes\n- Speed and Dolphin's Grace turn off while the gem is disabled, but the enchant passives do not.\n- The enchant passives set exactly Efficiency V and Soul Speed III. They check the holder's hands, armour slots and whole inventory.\n- Blur's cooldown reads the energy of the gem in the holder's main hand when the streak ends, or else the off hand, or else the first gem in the inventory, of any type. Only with no gem at all does the energy 1 cooldown apply (100 s).\n- While any player's Blur strikes are running, lightning damage is cancelled.\n- Swimming with the gem in the off hand and no Depth Strider boots leaves a yellow particle trail.\n- Low energy adds time to every cooldown, as described in [Energy](energy.md). The dragon egg halves Blur's cooldown, but not Terminal Velocity's.\n\n## Linked from\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "strength": "# Strength Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/strength_t1_e0.png) | ![](img/strength_t1_e1.png) | ![](img/strength_t1_e2.png) | ![](img/strength_t1_e3.png) | ![](img/strength_t1_e4.png) | ![](img/strength_t1_e5.png) |\n| Tier 2 | ![](img/strength_t2_e0.png) | ![](img/strength_t2_e1.png) | ![](img/strength_t2_e2.png) | ![](img/strength_t2_e3.png) | ![](img/strength_t2_e4.png) | ![](img/strength_t2_e5.png) |\n\n## HUD\n![](img/shot/strength_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_strength.png) Shadow Stalker cooldown |\n| 2 | ![](img/hud/strength_chain.png) Frailer/Nullify cooldown \u00b7 ![](img/hud/tier2_strength.png) Shadow Stalker cooldown \u00b7 ![](img/hud/strength_muscle.png) Chad Strength cooldown |\n\nThe Shadow Stalker slot reads `Active...` while a hunt is running. The [HUD](hud.md) page has more details.\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Sneak + right-click twice within 0.5 s | Gem in off hand, main hand empty or a sword/axe | 1+ | Shadow Stalker |\n| Hit an entity in melee | Gem in main hand | 2 | Frailer |\n| Left-click air or a block | Gem in main hand | 2 | Nullify |\n| Right-click while not looking at an entity within 5 blocks | Gem in main hand | 2 | Chad Strength |\n| Right-click while looking at an entity within 5 blocks | Gem in main hand | 2 | Group Chad Strength |\n| Drop (Q) | Gem in either hand, or drop the gem itself | 1+ | Enchants Sharpness |\n\nLeft-clicking or hitting with a tier 1 gem in the main hand shows the message \"You need tier 2 gem to cast this skill!\".\n\n## Ability (Tier 1+)\n### Shadow Stalker\n1. Sneaking and double right-clicking opens a menu that lists the head of every other online player (up to 54). The holder clicks the player to hunt.\n2. A hopper opens with the title \"Place Items Belonging To Target\". The holder puts in the target's player head, or item-tagged items whose owner or history involves the target, then closes it.\n3. The hunt needs the head or at least 1 matching item. Otherwise every item is returned with the message \"Insufficient amount of items.\" Non-matching items are always returned, and matching items are consumed.\n4. The hunt lasts 45 s per matching slot, and a head is worth 225 s (the same as 5 items). Only the larger of the two counts, not both added together. At energy 1\u20132 the hunt lasts 75% as long.\n\nWhile the hunt is running:\n- A red particle trail runs from the holder's eyes towards the target, up to 31 particles long (16 with reduced particles). Only the holder and [trusted](trust.md) players can see it, and it only appears while the holder is in the same dimension as the target.\n- The target hears a heartbeat, a bell and cave noise, and sees \"You feel like you're being watched...\" for 5 s.\n- Each time the holder comes within 500 blocks of the target, the holder sees \"You feel your victim nearby...\" and hears a wolf growl.\n\nThe hunt ends when the holder comes within 100 blocks of the target in the same dimension, when either player logs off, when time runs out, when the target dies, or when the holder's gem is disabled.\n\n**Cooldown:** 300 s, starting when the hunt starts. It does not depend on energy.\n\n## Powers (Tier 2)\n### Frailer\nFrailer fires when the holder hits a mob or player with the gem in the main hand while Frailer is ready.\n- The target gets **Weakness I for 20 s**.\n- For 20 s the target's helmet stops counting. It gives no armour, armour toughness or knockback resistance, no protection from falling blocks, and its protection enchantments are ignored. The helmet stays on.\n- A player target sees a \"Frailer\" boss bar for 20 s, and a red tether links the holder to them.\n- The effect ends early if the target dies or the holder's gem is disabled.\n\n**Cooldown:** 120 s at every energy level, shared with Nullify.\n[Trusted](trust.md) players are spared.\n\n### Nullify\nNullify fires when the holder left-clicks air or a block with the gem in the main hand.\n- Every mob and player touching a box around the holder loses **all potion effects for 30 s**. The box reaches this far in each direction:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Reach | 3.25 blocks | 3.75 blocks | 4.25 blocks | 4.75 blocks | 5 blocks |\n\n- For those 30 s, affected targets cannot drink potions or throw splash and lingering potions.\n- After 30 s the stripped effects return with their remaining time, unless the target already has that effect again. A target that dies gets nothing back.\n- Affected players see a \"Nullify\" boss bar.\n\n**Cooldown:** 120 s at every energy level. It is shared with Frailer, so using one puts both on cooldown.\n[Trusted](trust.md) players are spared.\n\n### Chad Strength\nChad Strength fires when the holder right-clicks with the gem in the main hand while not looking at an entity within 5 blocks.\n- Chad Strength lasts **60 s**. Three dots in front of the holder, at waist height, count their critical hits.\n- Every **4th melee critical hit deals 1.2\u00d7 damage**. Crits 1\u20133 fill the meter, and the 4th gets the bonus and resets it.\n- Crits on [trusted](trust.md) players do not count.\n- **Group version:** if the holder is looking at an entity within 5 blocks, the group version starts instead. The holder and every player the holder trusts within 4 blocks of that entity get it for **60 s**. For each of them, every **9th** melee critical hit deals **1.6\u00d7 damage**, and no dots are shown. It uses the same cooldown.\n\n**Cooldown:** 90 s after it ends, at every energy level. The HUD timer includes the 60 s active time.\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 2 | Strength | Strength I while the gem is in either hand |\n| 1 | Enchants Sharpness | Pressing drop (Q) with the gem in either hand, or dropping the gem itself, sets every sword and axe in the holder's inventory to Sharpness V |\n\n## Notes\n- Frailer and Nullify share one cooldown, shown by the ![](img/hud/strength_chain.png) timer.\n- Enchants Sharpness sets exactly Sharpness V, so a higher Sharpness level drops to V.\n- While the 300 s Shadow Stalker cooldown runs, the double right-click shows a cooldown message instead of opening the menu.\n- Low energy adds time to every cooldown, as described under [Energy](energy.md). The dragon egg halves the Frailer, Nullify and Chad
