 Strength timers, but not Shadow Stalker.\n- An entity that reacts to a right-click itself, such as an armor stand, takes the click when it is within reach, so neither Chad Strength nor Group Chad Strength starts.\n\n## Linked from\n- [Energy](energy.md)\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n", "trader": "# Trader\n\n![](img/trader.png)\n\nThe Trader changes the holder's gem type. Used on its own it rerolls the gem, and used on another player it swaps gems with them.\n\n## Recipe\n| | | |\n|---|---|---|\n| ![](img/diamond_block.png) | ![](img/dragon_breath.png) | ![](img/diamond_block.png) |\n| ![](img/dragon_breath.png) | ![](img/sculk_catalyst.png) | ![](img/dragon_breath.png) |\n| ![](img/diamond_block.png) | ![](img/dragon_breath.png) | ![](img/diamond_block.png) |\n\nThe recipe uses 4 diamond blocks, 4 dragon's breath and 1 sculk catalyst.\n\n## Rerolling\nRight-clicking with the Trader in the main hand while not looking at any entity rerolls the gem. The Trader is used up.\n- The holder's gem becomes a random gem of a different type.\n- The gem keeps its tier and energy. The item lore says \"tier one\", but that is wrong.\n- All of the holder's cooldowns are reset, and any lock on their abilities is cleared.\n\n## Swapping with a player\nRight-clicking another player who has a gem, with the Trader in the main hand, offers a swap. The Trader is not used up.\n- The other player receives an offer with Accept and Decline buttons (`/accepttrade` and `/denytrade`). The offer expires after 10 seconds.\n- Only the gem types are swapped. Each player keeps their own tier and energy.\n- Both players must wait 5 minutes before swapping again.\n\n## Linked from\n- [Commands](commands.md)\n- [Gems](gems.md)\n- [BlissSMP Wiki](home.md)\n", "trust": "# Trust\n\nAbilities that check trust do not affect players the user trusts. Trust is one-way: trusting someone does not make them trust back. Melee hits on trusted players still land, except the totem hit described below.\n\n| Command | What it does |\n|---|---|\n| `/trust add <player>` | Trusts a player. |\n| `/trust remove <player>` | Untrusts a player. |\n| `/trust list` | Opens a menu of every trusted player. Clicking a head untrusts that player. |\n| `/trust clear` | Untrusts everyone. |\n\nRight-clicking a player while holding a totem of undying in the main hand also trusts them. Hitting a trusted player with a totem of undying in the main hand untrusts them instead, and that hit does not land.\n\nHitting a trusted player 5 times within 15 seconds automatically removes them from the trust list.\n\n## Linked from\n- [Astra Gem](astra.md)\n- [Commands](commands.md)\n- [Fire Gem](fire.md)\n- [Flux Gem](flux.md)\n- [Gems](gems.md)\n- [BlissSMP Wiki](home.md)\n- [Life Gem](life.md)\n- [Puff Gem](puff.md)\n- [Speed Gem](speed.md)\n- [Strength Gem](strength.md)\n- [Wealth Gem](wealth.md)\n", "upgrader": "# Upgrader\n\n![](img/upgrader.png)\n\nThe Upgrader turns a tier 1 gem into a tier 2 gem, which unlocks the gem's powers.\n\n## Recipe\n| | | |\n|---|---|---|\n| ![](img/netherite_block.png) | ![](img/diamond_block.png) | ![](img/netherite_block.png) |\n| ![](img/diamond_block.png) | ![](img/nether_star.png) | ![](img/diamond_block.png) |\n| ![](img/netherite_block.png) | ![](img/diamond_block.png) | ![](img/netherite_block.png) |\n\nThe recipe uses 4 netherite blocks, 4 diamond blocks and 1 nether star.\n\n## Other sources\nWhen a player dies holding a tier 2 gem, an Upgrader drops where they died, as described on [Death](death.md).\n\n## Using it\nRight-clicking with the Upgrader in the main hand turns every tier 1 gem the holder carries into tier 2, using one Upgrader each. Gems that are already tier 2 are skipped.\n\n## Linked from\n- [Death](death.md)\n- [Gems](gems.md)\n- [BlissSMP Wiki](home.md)\n", "wealth": "# Wealth Gem\n| Energy | 0 | 1 | 2 | 3 | 4 | 5+ |\n|---|---|---|---|---|---|---|\n| Tier 1 | ![](img/wealth_t1_e0.png) | ![](img/wealth_t1_e1.png) | ![](img/wealth_t1_e2.png) | ![](img/wealth_t1_e3.png) | ![](img/wealth_t1_e4.png) | ![](img/wealth_t1_e5.png) |\n| Tier 2 | ![](img/wealth_t2_e0.png) | ![](img/wealth_t2_e1.png) | ![](img/wealth_t2_e2.png) | ![](img/wealth_t2_e3.png) | ![](img/wealth_t2_e4.png) | ![](img/wealth_t2_e5.png) |\n\n## HUD\n![](img/shot/wealth_t2.png)\n\n| Tier | Shows |\n|---|---|\n| 1 | ![](img/hud/tier1_wealth.png) only |\n| 2 | ![](img/hud/wealth_clover.png) Unfortunate/Item Lock timer \u00b7 ![](img/hud/tier2_wealth.png) \u00b7 ![](img/hud/wealth_money.png) Rich Rush/Amplification timer |\n\nThe [HUD](hud.md) page has more detail on the action bar.\n\n## Controls\n| Input | Hand | Tier | Triggers |\n|---|---|---|---|\n| Sneak + two right-clicks within 0.5 s | Gem in off hand, main hand empty or a sword/axe | 1+ | Pockets |\n| Melee hit on an entity | Gem in main hand | 2 | Unfortunate |\n| Left-click on air or a block | Gem in main hand | 2 | Item Lock |\n| Right-click, not aiming at an entity within 5 blocks | Gem in main hand | 2 | Rich Rush |\n| Right-click on an entity | Gem in main hand | 2 | Amplification |\n| Drop (Q) | Gem in either hand, or drop the gem itself | 1+ | Enchants Mending / Fortune / Looting |\n\n## Ability (Tier 1+)\n### Pockets\nSneaking and double right-clicking opens **Pockets**, a private 9-slot storage. Its contents persist between uses and across restarts.\n\nIf the holder dies with the gem in the off hand, the Pockets contents drop with the holder's loot and Pockets is emptied. keepInventory prevents this.\n\n**Cooldown:** none.\n\n## Powers (Tier 2)\n### Unfortunate\nUnfortunate is cast by hitting a mob or player with the gem in the main hand.\n\nThe target is jinxed for **20 s** and sees an \"Unfortunate\" boss bar, and a green tether links the holder to the target. Every action the target takes gets a **new, independent 50% roll**:\n- **Melee hit:** a failed roll halves that hit's damage (\u00d70.5). The hit still lands.\n- **Right-click:** a failed roll cancels the click. It is never rolled while the target holds a golden apple or enchanted golden apple, or an item that throws or shoots something; those get only the launch roll.\n- **Breaking a block:** a failed roll means the block does not break.\n- **Launching a projectile:** a failed roll means the projectile is not launched, and the thrown item or arrow is still used up.\n\nEvery failed roll plays an anvil clank to the target.\n\nSeparately from the rolls, every golden apple or enchanted golden apple the target eats has its absorption **halved** one tick later.\n\nOnly players are affected. Hitting a mob still starts Unfortunate and its cooldown.\n\n**Cooldown:** starts after the 20 s effect ends and is shared with Item Lock:\n\n| Energy | 1 | 2 | 3 | 4 | 5\u201310 |\n|---|---|---|---|---|---|\n| Cooldown | 80 s | 77.5 s | 75 s | 72.5 s | 70 s |\n\n[Trusted](trust.md) players are spared.\n\n### Item Lock\nItem Lock is cast by left-clicking air or a block with the gem in the main hand.\n- Every other player within **2 blocks** has the type of item in their main hand locked for **30 s**. The lock applies to the item type, so every stack of it is locked.\n- A locked item cannot be used to left-click or right-click, eaten or drunk from either hand, or used to mine or hit. It shows the vanilla item cooldown and a boss bar.\n- Prismarine shards, amethyst shards and prismarine crystals are never locked.\n- The lock ends early if that player dies.\n\n**Cooldown:** the same as Unfortunate's table above, starting after the 30 s lock ends. It is shared with Unfortunate.\n[Trusted](trust.md) players are spared.\n\n### Rich Rush\nRich Rush is cast by right-clicking with the gem in the main hand while not aiming at an entity.\n- The holder gets **Haste II for 150 s**.\n- For **300 s**, a single loot multiplier applies, rolled as a random whole number from **2 to 5**.\n- Mobs the holder kills drop their loot that many times over. Players, mules, donkeys, llamas, trader llamas and foxes are excluded.\n- Any block whose name ends in `_ore` drops one extra set of its normal drops, as long as the correct tool is used. Ancient debris is excluded.\n- **If the holder's main-hand tool has Silk Touch, ores get no extra drop** while Rich Rush is running.\n\n**Cooldown:** 300 s after it ends, at every energy level. The HUD timer includes the 300 s active time. It is shared with Amplification.\n\n### Amplification\nAmplification is cast by right-clicking any entity with the gem in the main hand.\n\nFor **50 s**, the holder and every [trusted](trust.md) player within **2.5 blocks of that entity** get +1 level on the enchantments below, on every item in the inventory. Only the listed levels are raised:\n\n| Enchantment | Level raised |\n|---|---|\n| Sharpness | III, IV, V |\n| Protection | III, IV |\n| Projectile / Fire / Blast Protection, Feather Falling | IV |\n| Unbreaking, Looting, Sweeping Edge, Depth Strider, Swift Sneak, Soul Speed, Respiration, Thorns, Fortune, Quick Charge, Lure, Luck of the Sea, Loyalty, Riptide | III |\n| Efficiency, Impaling | V |\n| Power | V (and IV on the holder's own items only) |\n| Piercing | IV |\n| Fire Aspect, Punch | II |\n| Mending, Aqua Affinity, Silk Touch, Infinity, Flame, Multishot, Channeling | I |\n\nUntrusted players are never affected.\n\nAn item that is already amplified is not raised again by a second cast, from the holder or another Wealth player. The new cast only extends the time it stays amplified, and the item always returns to its original level.\n\n**Cooldown:** 300 s from use, at every energy level. It is shared with Rich Rush, and Amplification cannot be used while Rich Rush is running.\n\n## Passives\n| Energy needed | Passive | Effect |\n|---|---|---|\n| 2 | Hero of the Village | Hero of the Village I while the gem is in either hand |\n| 2 | Luck | Luck I while the gem is in either hand |\n| 1 | Enchants Mending | On drop (Q), adds Mending to every inventory item with durability |\n| 1 | Enchants Fortune | On drop (Q), sets Fortune III on every pickaxe, axe, shovel and hoe |\n| 1 | Enchants Looting | On drop (Q), sets Looting III on every sword and axe |\n| 1 | Bonus Ores | With the gem in the off hand, a block ending in `_ore` has a 25% chance to drop one extra set (correct tool needed, not ancient debris) |\n| 1 | Extra EXP | With the gem in the off hand, XP gained is doubled |\n| 1 | Durability Chip | With the gem in the off hand, a melee crit or sprint hit takes 2 durability from each of the target's armour pieces. [Trusted](trust.md) players are spared |\n| 1 (tier 2 gem) | Double Debris | With the gem in the off hand, ancient debris breaks straight into 2 netherite scrap |\n\n## Notes\n- Unfortunate and Item Lock share one cooldown, shown by the ![](img/hud/wealth_clover.png) timer. Rich Rush and Amplification share another, shown by the ![](img/hud/wealth_money.png) timer.\n- With the gem in the off hand, taking netherite scrap out of a furnace or blast furnace result slot gives the holder that many extra scrap. Like Double Debris, this needs a tier 2 gem with at least 1 energy.\n- Amplified items only revert while they are in an online player's inventory. This is checked every second.\n- Enchants Fortune and Enchants Looting set exactly level III, so higher levels drop to III.\n- Low energy adds time to every cooldown, as described in [Energy](energy.md). The dragon egg halves the Unfortunate/Item Lock and Rich Rush/Amplification timers.\n\n## Linked from\n- [BlissSMP Wiki](home.md)\n- [HUD](hud.md)\n"}, "sections": [["Start", ["home", "gems", "energy", "death"]], ["Gems", ["fire", "flux", "astra", "speed", "strength", "wealth", "life", "puff"]], ["Items", ["energy-bottle", "trader", "upgrader"]], ["Reference", ["trust", "commands", "hud"]]]};
const MARKER = "## Linked from";
const slug = t => t.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
const title = name => (DATA.pages[name].match(/^# (.+)$/m) || [, name])[1];

const renderer = new marked.Renderer();
renderer.heading = (text, level, raw) => `<h${level} id="${slug(raw)}">${text}</h${level}>`;
renderer.link = (href, t, text) => {
  const m = href && href.match(/^([a-z0-9-]+)\.md(?:#(.*))?$/);
  if (m) href = `#/${m[1]}${m[2] ? "/" + m[2] : ""}`;
  return `<a href="${href}"${/^https?:/.test(href) ? ' target="_blank"' : ""}>${text}</a>`;
};
renderer.blockquote = quote => `<blockquote>${quote.replace(/<p>\[!(\w+)\]\s*/i, "<p>")}</blockquote>`;
marked.use({ renderer, gfm: true });

const nav = document.querySelector("nav");
nav.innerHTML = '<div class="brand">BlissSMP Wiki</div>' + DATA.sections.map(([name, list]) =>
  `<h4>${name}</h4>` + list.filter(p => DATA.pages[p]).map(p => `<a href="#/${p}" data-p="${p}">${title(p)}</a>`).join("")
).join("");

function show() {
  const [, page = "home", anchor] = location.hash.match(/^#\/([^/]+)(?:\/(.+))?/) || [];
  const name = DATA.pages[page] ? page : "home";
  const [body, back] = DATA.pages[name].split("\n" + MARKER + "\n");
  const html = marked.parse(body) + (back ? `<section class="backlinks"><h2>Linked from</h2>${marked.parse(back)}</section>` : "");
  const article = document.querySelector("article");
  article.innerHTML = html;
  article.querySelectorAll("table").forEach(t => {
    const cells = [...t.querySelectorAll("tbody td")];
    if (cells.length && cells.every(c => c.querySelector("img") && !c.textContent.trim())) t.classList.add("grid");
  });
  document.title = title(name) + " · BlissSMP Wiki";
  nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.p === name));
  nav.classList.remove("open");
  const target = anchor && document.getElementById(anchor);
  target ? target.scrollIntoView() : window.scrollTo(0, 0);
}
addEventListener("hashchange", show);
show();
</script>
